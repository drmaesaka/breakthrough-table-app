name: Nudge cron

# Manual trigger only. GitHub's scheduled queue never fired this workflow once
# in 78 minutes, so cron-job.org drives the real schedule; leaving a second
# scheduler armed here would double-nudge every member. Kept for on-demand
# testing: gh workflow run nudge-cron.yml
on:
  workflow_dispatch:

jobs:
  send-nudges:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call /api/send-nudges
        run: |
          http_code=$(curl -sS -o response.json -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.NUDGE_SECRET }}" \
            https://breakthrough-table-app.vercel.app/api/send-nudges)
          echo "HTTP $http_code"
          cat response.json
          [ "$http_code" = "200" ]
      - name: Call /api/send-checkin
        if: always()
        run: |
          http_code=$(curl -sS -o checkin.json -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.NUDGE_SECRET }}" \
            https://breakthrough-table-app.vercel.app/api/send-checkin)
          echo "HTTP $http_code"
          cat checkin.json
          [ "$http_code" = "200" ]
