name: Nudge cron

on:
  schedule:
    # Every 30 minutes, deliberately off :00 and :30 — GitHub queues scheduled
    # runs globally and the top and half of the hour are the most congested,
    # where runs get delayed or dropped outright. A run delayed past the
    # endpoint's 30-minute matching window misses that nudge entirely.
    - cron: "7,37 * * * *"
  workflow_dispatch:

jobs:
  send-nudges:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call /api/send-nudges
        run: |
          http_code=$(curl -sS -o response.json -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.NUDGE_SECRET }}" \
            https://breakthrough-table-app.vercel.app/api/send-nudges)
          echo "HTTP $http_code"
          cat response.json
          [ "$http_code" = "200" ]
      - name: Call /api/send-checkin
        if: always()
        run: |
          http_code=$(curl -sS -o checkin.json -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.NUDGE_SECRET }}" \
            https://breakthrough-table-app.vercel.app/api/send-checkin)
          echo "HTTP $http_code"
          cat checkin.json
          [ "$http_code" = "200" ]
