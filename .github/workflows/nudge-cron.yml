name: Nudge cron

on:
  schedule:
    # Every 30 minutes. GitHub cron is best-effort; runs can lag a few
    # minutes, which is fine because the endpoint matches a 30-min window.
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  send-nudges:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call /api/send-nudges
        run: |
          http_code=$(curl -sS -o response.json -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.NUDGE_SECRET }}" \
            https://breakthrough-table-app.vercel.app/api/send-nudges)
          echo "HTTP $http_code"
          cat response.json
          [ "$http_code" = "200" ]
      - name: Call /api/send-checkin
        if: always()
        run: |
          http_code=$(curl -sS -o checkin.json -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.NUDGE_SECRET }}" \
            https://breakthrough-table-app.vercel.app/api/send-checkin)
          echo "HTTP $http_code"
          cat checkin.json
          [ "$http_code" = "200" ]
